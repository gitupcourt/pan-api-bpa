name: security

# AppSec CI security gate for pan-api-bpa.
#
# The primary risk in this repo is the same as its sibling engine's: a
# firewall config, tech-support file, or API report getting committed.
# gitleaks is BLOCKING and is a required check on main. The workflow
# pattern (commit-range scoping, env-based event injection hygiene,
# container image at :latest for ruleset freshness with the scanned
# target pinned by checkout SHA) mirrors open-pan-bpa's gate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 08:00 UTC — matches pan-ops-console's cadence. Catches a
    # CVE disclosed against an already-pinned, unchanged dependency (requests
    # et al.) instead of waiting on Dependabot's own version-bump PR.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the --log-opts range resolves

      - name: gitleaks (commit-range scoped)
        env:
          # Pass event fields via env — never interpolate ${{ }} directly
          # into the script body — so a crafted ref/SHA can't break out of
          # the shell (standard Actions script-injection hygiene).
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          scan() {
            docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:latest \
              git /repo --redact --no-banner --verbose \
              --log-opts="$1"
          }
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "Scanning PR commit range: ${PR_BASE}..${PR_HEAD}"
            scan "${PR_BASE}..${PR_HEAD}"
          elif echo "${PUSH_BEFORE}" | grep -qE '^0+$'; then
            echo "No before-SHA (first push) — scanning HEAD commit only"
            scan "-1 ${PUSH_HEAD}"
          else
            echo "Scanning pushed range: ${PUSH_BEFORE}..${PUSH_HEAD}"
            scan "${PUSH_BEFORE}..${PUSH_HEAD}"
          fi

  # ===================================================================
  # DEPENDENCY AUDIT — Python (pip-audit). FAILS on a finding, but is
  # deliberately NOT a required check on main: with one dependency and a
  # clean baseline there is nothing to ratchet, and a red job (or a failed
  # scheduled run, which notifies) is the signal we want. Keeping it out of
  # the required set means an upstream advisory with no fixed release yet
  # cannot block unrelated merges.
  # ===================================================================
  deps-python:
    name: pip-audit (dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: pip-audit against requirements.txt
        run: |
          set -o pipefail
          python -m pip install --upgrade pip pip-audit
          echo "## pip-audit — requirements.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rc=0
          pip-audit -r requirements.txt --desc 2>&1 | tee /tmp/pip-audit.txt || rc=$?
          cat /tmp/pip-audit.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
